[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "codeguardian"
version = "1.2.0"
description = "Static code analysis tool for Python projects"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "pyyaml",
    "gitpython",
]


[tool.setuptools.packages.find]
where = ["src"]